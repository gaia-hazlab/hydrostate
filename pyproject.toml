[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrostate"
version = "0.1.0a1"
description = "Verified research prototypes for watershed vadose-zone and groundwater dynamics."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GAIA Hazlab contributors" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
numerics = [
  "numpy>=1.26",
  "scipy>=1.11",
]
datahub = [
  "numpy>=1.26",
  "pandas>=2.0",
  "xarray>=2024.10",
  "pyproj>=3.6",
  "rioxarray>=0.23",
  "zarr>=3",
  "gaia-cli @ git+https://github.com/gaia-hazlab/gaia-cli.git@aa8ed3def5af4c32a4a1e601252fcee439344ac8",
]
modflow = [
  "flopy>=3.9.0",
  "numpy>=1.26",
]
geo = [
  "geopandas>=0.14",
  "pandas>=2.0",
  "rasterio>=1.3",
  "rioxarray>=0.15",
  "shapely>=2.0",
  "xarray>=2024.1",
]
calibration = [
  "pyemu>=1.2",
]
toy = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8",
]

[project.scripts]
hydrostate = "hydrostate.cli:main"
puget-modflow = "puget_modflow.cli:main"

[project.urls]
Repository = "https://github.com/gaia-hazlab/hydrostate"
Issues = "https://github.com/gaia-hazlab/hydrostate/issues"
Documentation = "https://github.com/gaia-hazlab/hydrostate/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]
requires-pixi = ">=0.61.0"

[tool.pixi.dependencies]
python = "3.12.*"
flopy = ">=3.9.0"
geopandas = ">=0.14"
modflow6 = "*"
numpy = ">=1.26"
pandas = ">=2.0"
pyemu = ">=1.2"
pytest = ">=8"
rasterio = ">=1.3"
rioxarray = ">=0.15"
shapely = ">=2.0"
xarray = ">=2024.1"

[tool.pixi.pypi-dependencies]
hydrostate = { path = ".", editable = true }

[tool.pixi.tasks]
help = "python -m puget_modflow --help"
test = "python -m unittest discover -s tests"
sources = "python -m puget_modflow sources --config config/puget_sound.toml"
plan = "python -m puget_modflow plan --config config/puget_sound.toml --output runs/puget_sound/pipeline_plan.json"
fetch-reference = "python -m puget_modflow fetch-reference --config config/puget_sound.toml --output data/raw/usgs_reference"
build-template = "python -m puget_modflow build-template --config config/puget_sound.toml --recharge data/processed/recharge_timeseries.csv --output runs/template_mf6"
build-template-smoke = "python -m puget_modflow build-template --config config/puget_sound.toml --output runs/template_mf6"
run-template = "python -m puget_modflow run --workspace runs/template_mf6 --exe mf6"
toy-watershed = "python -m puget_modflow.toy_watershed --output runs/toy_watershed/results.json"
plot-toy = "python scripts/plot_toy_watershed.py --input runs/toy_watershed/results.json --output runs/toy_watershed"
valley3d = "python -m hydrostate.valley --output runs/valley3d/results.json"
verify-math = "python -m hydrostate.verification --output runs/verification/report.json"
